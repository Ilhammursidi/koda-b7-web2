<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalender Maret</title>
    <style>
        body {
            font-weight: bold;
            padding: 320px;
            margin: auto;
        }

       .kanan {
            display: inline;
       } 

       .hari {
        display: inline-block;
        width: 80px;
        text-align: center;
        padding: 2px;
       }

       .hari div {
        padding: 5px;
       }

       .merah {
        color: red;
       }

       .hijau {
        color: green;
       }

       .unsolid {
        opacity: 40%;
       }

       h1 {
        margin-left: 20px;
       }

       .bungkus {
        border: 2px solid black;
        width: 620px;
        padding-bottom: 20px;
       }

       .libur {
        color: red;
       }
    </style>
</head>
<body>
    <div class="bungkus">
    <h1>MARCH 2026</h1>
    <div class="kanan">
    <div class="hari merah">
        <div>Sunday</div>
        <div>1</div>
        <div>8</div>
        <div>15</div>
        <div class="libur">22</div>
        <div>29</div>
    </div>
    <div class="hari">
        <div>Monday</div>
        <div>2</div>
        <div>9</div>
        <div>16</div>
        <div class="libur">23</div>
        <div>30</div>
    </div>
    <div class="hari">
        <div>Tuesday</div>
        <div>3</div>
        <div>10</div>
        <div>17</div>
        <div class="libur">24</div>
        <div>31</div>
    </div>
    <div class="hari">
        <div>Wednesday</div>
        <div>4</div>
        <div>11</div>
        <div class="libur">18</div>
        <div>25</div>
        <div class="unsolid">1</div>
    </div>
    <div class="hari">
        <div>Thursday</div>
        <div>5</div>
        <div>12</div>
        <div class="libur">19</div>
        <div>26</div>
        <div class="unsolid">2</div>
    </div>
    <div class="hari hijau">
        <div>Friday</div>
        <div>6</div>
        <div>13</div>
        <div class="libur">20</div>
        <div>27</div>
        <div class="unsolid">3</div>
    </div>
    <div class="hari">
        <div>Saturday</div>
        <div>7</div>
        <div>14</div>
        <div class="libur">21</div>
        <div>28</div>
        <div class="unsolid">4</div>
    </div>
    </div>
    </div>
</body>
</html>
